[project]
name = "news-scraper"
version = "0.1.0"
description = "Self-healing, database-backed news scraper built on self-healing-scraper"
requires-python = ">=3.12"
dependencies = [
    "self-healing-scraper>=0.2.0",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.14.0",
    "typer>=0.15.0",
    "typing-extensions>=4.5.0",
]

[project.scripts]
news-scrape = "news_scraper.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

# Set to true (and add a hatchling build-system) when packaging for publish.
# Kept false so `uv sync` works in environments that block editable builds.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["news_scraper"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["./src"]
python-version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits live websites and requires DATABASE_URL / LLM_API_KEY",
]
