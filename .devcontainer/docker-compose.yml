services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      # Workspace (this repo)
      - ..:/workspaces/daily-news-1:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql+psycopg://news:news@db:5432/news_scraper
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_scraper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
